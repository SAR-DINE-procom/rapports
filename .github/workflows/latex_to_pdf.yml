name: Build LaTeX documents
on: [push]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed LaTeX projects
        id: detect_changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          echo "Fichiers modifiés : $CHANGED_FILES"

          # Vérifier si src/rapport_complet/main.tex a été modifié et existe
          if echo "$CHANGED_FILES" | grep -q "src/rapport_complet/main\.tex" && [ -f "src/rapport_complet/main.tex" ]; then
            echo "rapport_complet_modified=true" >> $GITHUB_OUTPUT
          fi

      - name: Compile rapport_complet (si modifié)
        if: steps.detect_changes.outputs.rapport_complet_modified == 'true'
        run: |
          # Copier les dossiers sty et ico dans le dossier de travail
          cp -r sty ico src/rapport_complet/
          # Copier le fichier latexmkrc si présent
          if [ -f latexmkrc ]; then
            cp latexmkrc src/rapport_complet/
          fi

      - name: Run LaTeX compilation with xu-cheng/latex-action
        if: steps.detect_changes.outputs.rapport_complet_modified == 'true'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: src/rapport_complet

      - name: Upload PDF (respecting directory structure)
        if: steps.detect_changes.outputs.rapport_complet_modified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PDF_rapport_complet
          path: src/rapport_complet/main.pdf
