name: Build LaTeX Projects

on: push   # Se lance à chaque push, quelle que soit la branche

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: texlive/texlive:latest   # Image Docker avec LaTeX déjà installé

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX projects
        run: |
          mkdir -p build
          for project in src/*; do
            if [ -d "$project" ] && [ -f "$project/main.tex" ]; then
              project_name=$(basename "$project")
              outdir="build/$project_name"
              mkdir -p "$outdir"
              echo "Compiling $project -> $outdir/${project_name}.pdf"

              # Compile (PDF dans $outdir)
              latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir="$outdir" "$project/main.tex"

              # Renommer le PDF final
              mv "$outdir/main.pdf" "$outdir/${project_name}.pdf"

              # Nettoyer les fichiers auxiliaires
              latexmk -c -outdir="$outdir" "$project/main.tex" || true
            fi
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: latex-pdfs
          path: build/
