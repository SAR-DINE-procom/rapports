name: Build LaTeX Projects

on:
  push:
    branches:
      - base
      
jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: texlive/texlive:latest   # Image Docker avec LaTeX déjà installé

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX projects
        run: |
          mkdir -p build
          for project in src/*; do
            if [ -d "$project" ] && [ -f "$project/main.tex" ]; then
              project_name=$(basename "$project")
              outdir="build"
              tmpdir="build/tmp_$project_name"

              mkdir -p "$outdir" "$tmpdir"
              echo "Compiling $project -> $outdir/${project_name}.pdf"

              # Compile dans un répertoire temporaire
              latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir="$tmpdir" "$project/main.tex"

              # Déplacer le PDF final et le renommer
              mv "$tmpdir/main.pdf" "$outdir/${project_name}.pdf"

              # Nettoyer les fichiers auxiliaires (dans tmpdir)
              latexmk -c -outdir="$tmpdir" "$project/main.tex" || true

              # Supprimer le répertoire temporaire
              rm -rf "$tmpdir"
            fi
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: latex-pdfs
          path: build/
