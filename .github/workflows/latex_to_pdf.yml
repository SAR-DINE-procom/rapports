name: Build LaTeX document
on: [push]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest  # Image Docker officielle avec TeX Live
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Suffisant pour comparer HEAD~1 et HEAD

      - name: Detect changed LaTeX projects
        id: detect_changes
        run: |
          # Récupérer les fichiers modifiés entre les deux derniers commits
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Fichiers modifiés : $CHANGED_FILES"

          # Extraire les dossiers contenant un main.tex modifié
          PROJECT_DIR=$(echo "$CHANGED_FILES" | grep -E 'main\.tex$' | sed 's|/main\.tex$||' | head -n 1)

          if [ -n "$PROJECT_DIR" ]; then
            echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          fi

      - name: Compile modified LaTeX project
        if: steps.detect_changes.outputs.project_dir
        run: |
          PROJECT_DIR="${{ steps.detect_changes.outputs.project_dir }}"
          echo "Compilation du projet : $PROJECT_DIR"

          # Copier les ressources partagées (sty, ico, latexmkrc) dans le dossier du projet
          cp -r sty ico latexmkrc "$PROJECT_DIR"/

          # Compiler avec latexmk
          cd "$PROJECT_DIR"
          latexmk -pdf -r latexmkrc main.tex

      - name: Upload PDF
        if: steps.detect_changes.outputs.project_dir
        uses: actions/upload-artifact@v4
        with:
          name: PDF-${{ steps.detect_changes.outputs.project_dir }}
          path: ${{ steps.detect_changes.outputs.project_dir }}/main.pdf
